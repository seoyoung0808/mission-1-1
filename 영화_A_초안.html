function avatar(name,i=0){const cols=['#e9e7f0','#e5ecdf','#f1e3dc'];return '<span class="avatar" style="background:'+cols[i%3]+'">'+esc([...name][0]||'친')+'</span>'}
function friendBadges(id){return data.friends.filter(f=>f.ratings[id]).map(f=>'<span class="friend-tier" style="--tier-bg:'+COLORS[f.ratings[id]]+'">'+esc(f.name)+' <b>'+f.ratings[id]+'</b></span>').join('')}
function movieCard(m,publicMode=false){return '<button type="button" class="movie-card" data-action="detail" data-id="'+m.id+'" aria-label="'+esc(m.title)+' 영화 정보'+(!publicMode?' 및 기록 편집':'')+'">'+poster(m)+'<div class="movie-title">'+esc(m.title)+'</div><div class="movie-year">'+m.year+'</div>'+(!publicMode?'<div class="friend-tiers">'+friendBadges(m.id)+'</div>':'')+'</button>'}
function nav(){const n=[['journal','book','내 기록장'],['search','search','영화 찾기'],['friends','people','친구']];return {top:'<nav class="desktop-nav" aria-label="주요 메뉴">'+n.map(([p,i,t])=>'<button type="button" data-action="navigate" data-page="'+p+'" class="'+(page===p?'active':'')+'" '+(page===p?'aria-current="page"':'')+'>'+t+'</button>').join('')+'</nav>',bottom:'<nav class="bottom-nav" aria-label="주요 메뉴">'+n.map(([p,i,t])=>'<button type="button" data-action="navigate" data-page="'+p+'" class="'+(page===p?'active':'')+'" '+(page===p?'aria-current="page"':'')+'>'+icon(i)+t+'</button>').join('')+'</nav>'}}
function header(simple=false){const n=nav();return '<header class="topbar"><div class="topbar-inner">'+brand()+(!simple?n.top:'')+'<div class="account">'+(!simple?'<span class="account-name small">'+esc(data.profile.name)+'</span><span class="status">예시 계정</span>'+avatar(data.profile.name):'<span class="pill">오프라인 시제품</span>')+'<button class="help-button" data-action="help" aria-label="사용 안내">'+icon('help')+'</button></div></div></header>'}
function warning(){return storageOK?'':'<div class="save-warning" role="status">이 브라우저에서 자동 저장이 제한되어 있어요. 현재 열린 화면에서는 계속 사용할 수 있어요.</div>'}
function footer(publicMode=false){return '<footer class="footer"><span>한 편의 영화, 나만의 취향으로.</span><span>'+(publicMode?'공유한 시점의 티어 목록 · 감상 메모 비공개':'<span class="offline-dot"></span>예시 자료 20편 · '+(storageOK?'기록은 이 브라우저에 저장돼요':'현재 열린 화면에서 이용 중'))+'</span></footer>'}
function showLogin(){root.className='';root.innerHTML=header(true)+'<main class="login-wrap"><section class="login-copy"><span class="eyebrow">좋아하는 영화를 모으는 작은 습관</span><h1>한 편씩 쌓이는<br>나만의 <em>영화 취향.</em></h1><p>좋았던 영화는 오래 기억하고,<br>같이 본 영화는 친구의 시선으로 한 번 더.<br>나의 취향이 담긴 영화 기록장을 만들어 보세요.</p><button class="primary coral" data-action="login">예시 계정으로 시작하기 '+icon('arrow')+'</button><div class="login-caption">'+icon('lock')+'가입 없이, 준비된 예시 계정으로 체험해요</div><div class="login-features"><span>'+icon('check')+'티어로 간편하게</span><span>'+icon('note')+'메모는 나만</span><span>'+icon('people')+'취향은 함께</span></div></section><section class="login-art" aria-label="영화 기록장 예시"><span class="login-decoration"></span><div class="art-board"><div class="art-top"><span>나의 영화 한 페이지</span><i>기억하고 싶은 영화들</i></div><div class="art-row" style="--tier-bg:var(--s)"><strong>S</strong>'+[1,2,4].map(id=>poster(MOVIES[id-1])).join('')+'</div><div class="art-row" style="--tier-bg:var(--a)"><strong>A</strong>'+[3,8,20].map(id=>poster(MOVIES[id-1])).join('')+'</div></div><div class="art-sticker">같은 영화, 우리만의 다른 취향.</div><div class="art-caption">모든 그림과 영화 정보가 이 파일 안에 담겨 있어요.</div></section></main><footer class="login-footer">예시 계정으로 체험하는 시제품 · 인터넷 연결 없이 이용할 수 있어요</footer>'}
function tierBoard(ratings,publicMode=false){return '<div class="board">'+TIERS.filter(t=>publicMode||filter==='all'||filter===t).map(t=>{const movies=MOVIES.filter(m=>(publicMode?ratings[m.id]:data.entries[m.id]?.tier)===t);return '<section class="tier-row" style="--tier-bg:'+COLORS[t]+'" aria-label="'+t+' 티어"><div class="tier-label"><b>'+t+'</b><span>'+movies.length+'편</span></div><div class="tier-movies">'+(movies.length?movies.map(m=>movieCard(m,publicMode)).join(''):'<div class="empty-tier"><p>아직 이 티어에 담긴 영화가 없어요.</p>'+(!publicMode?'<button data-action="add-to-tier" data-tier="'+t+'">+ 영화 담기</button>':'')+'</div>')+'</div></section>'}).join('')+'</div>'}
function overlap(friend){return Object.keys(data.entries).filter(id=>friend.ratings[id]).length}
function matches(friend){const ids=Object.keys(data.entries).filter(id=>friend.ratings[id]);return ids.length?Math.round(ids.filter(id=>friend.ratings[id]===data.entries[id].tier).length/ids.length*100):null}
function sideBar(){return '<aside class="sidebar"><section class="aside-card"><div class="aside-heading"><h2>함께 보는 취향</h2><button data-action="navigate" data-page="friends">친구 관리 '+icon('arrow')+'</button></div><p class="muted small">같이 본 영화에 친구의 티어가 보여요.</p>'+data.friends.slice(0,5).map((f,i)=>'<div class="friend-mini">'+avatar(f.name,i)+'<div><p>'+esc(f.name)+'</p><small>함께 본 영화 '+overlap(f)+'편</small></div><span class="match">'+(matches(f)===null?'—':matches(f)+'%')+'</span></div>').join('')+'<button class="add-friend-small" data-action="navigate" data-page="friends">'+icon('plus')+'공유 링크로 친구 추가</button>'+(data.friends.length?'<p class="small muted" style="font-size:9px;margin-top:10px">같은 티어 비율 · 함께 본 영화 기준</p>':'')+'</section><section class="aside-card quote-card"><div class="quote-icon">“</div><h3>어떤 영화가 좋았는지,<br>그때의 나를<br>기억하는 방법.</h3><p>영화를 누르면 나만의 메모를 남길 수 있어요.<br>메모는 공유한 목록에 보이지 않아요.</p></section><p class="aside-help">포스터는 파일에 담긴 예시 그림이에요.<br>연도는 최초 개봉·공개 연도를 참고했어요.</p></aside>'}
function journal(){const count=Object.keys(data.entries).length,noteCount=Object.values(data.entries).filter(e=>e.note).length;return '<div class="page-heading"><div><span class="eyebrow">나의 영화 기록</span><h1>취향이 쌓이는 기록장</h1><p>좋아했던 장면들을, 나만의 순서로.</p></div><div class="heading-actions"><button class="secondary" data-action="share">'+icon('share')+'<span>공유하기</span></button><button class="primary" data-action="navigate" data-page="search">'+icon('plus')+'영화 추가</button></div></div><div class="page-layout"><section class="main-panel" aria-label="내 영화 티어리스트"><div class="overview"><div class="overview-stat"><div><strong>'+count+'</strong><span>기록한 영화</span></div><div><strong>'+noteCount+'</strong><span>나만의 메모</span></div><div><strong>'+data.friends.length+'</strong><span>영화 친구</span></div></div><span class="pill green">'+icon('check')+'나의 취향 수집 중</span></div><div class="tabs" role="group" aria-label="티어별 보기">'+['all',...TIERS].map(t=>'<button class="tab '+(filter===t?'active':'')+'" data-action="filter" data-tier="'+t+'" aria-pressed="'+(filter===t)+'">'+(t==='all'?'전체':t)+'<span class="count">'+(t==='all'?count:Object.values(data.entries).filter(e=>e.tier===t).length)+'</span></button>').join('')+'</div>'+tierBoard(null)+'</section>'+sideBar()+'</div>'}
function norm(text){return String(text).normalize('NFKC').toLocaleLowerCase().replace(/[\s·:：.\-]/g,'')}
function searchMovies(){const q=norm(query);return MOVIES.filter(m=>!q||norm(m.title+' '+m.director+' '+m.year+' '+ENGLISH[m.id-1]).includes(q))}
function searchCards(){const movies=searchMovies();return movies.length?movies.map(m=>{const selected=data.entries[m.id]?.tier;return '<article class="result-card">'+ '<button class="movie-card" data-action="detail" data-id="'+m.id+'" aria-label="'+esc(m.title)+' 자세히 보기">'+poster(m)+'</button><div class="result-info"><h2>'+esc(m.title)+'</h2><div class="meta">'+m.year+' · '+esc(m.director)+'</div><p class="result-story">'+esc(m.story)+'</p><p class="result-label">'+(selected?'내 티어 '+selected+' · 눌러서 변경':'어느 티어에 담을까요?')+'</p>'+picker(m.id,selected)+'</div></article>'}).join(''):'<div class="nothing">'+icon('search')+'<h2>찾는 영화가 없어요</h2><p>제목, 감독 또는 연도를 다시 확인해 주세요.<br>이 시제품에서는 준비된 영화 20편을 검색할 수 있어요.</p><button class="secondary" style="margin-top:20px" data-action="clear-query">전체 영화 보기</button></div>'}
function searchPage(){return '<div class="page-heading"><div><span class="eyebrow">한 편 더, 나의 기록에</span><h1>어떤 영화를 보셨나요?</h1><p>검색하고 티어를 누르면 바로 내 목록에 담겨요.</p></div></div><label class="search-box">'+icon('search')+'<span class="sr-only">영화 제목, 감독 또는 연도 검색</span><input id="movie-search" type="search" value="'+esc(query)+'" placeholder="영화 제목, 감독 또는 연도로 찾아보세요" autocomplete="off"><button class="clear-search" data-action="clear-query" aria-label="검색어 지우기" '+(!query?'hidden':'')+'>'+icon('close')+'</button></label><div class="search-summary"><span id="search-count">'+(query?'검색 결과':'준비된 영화')+' '+searchMovies().length+'편</span><span>최초 개봉·공개 연도 · 내장 예시 포스터</span></div>'+(targetTier?'<div class="share-note">'+targetTier+' 티어에 영화를 찾고 있어요. 검색 결과에서 원하는 티어를 직접 선택해 주세요.</div>':'')+'<section class="search-results" id="search-results" aria-label="영화 검색 결과">'+searchCards()+'</section>'}
function picker(id,selected){return '<div class="tier-picker" role="group" aria-label="'+esc(MOVIES[id-1].title)+' 티어 선택">'+TIERS.map(t=>'<button type="button" class="tier-choice '+(selected===t?'selected':'')+'" data-action="set-tier" data-id="'+id+'" data-tier="'+t+'" style="--tier-bg:'+COLORS[t]+'" aria-pressed="'+(selected===t)+'" aria-label="'+esc(MOVIES[id-1].title)+' '+t+' 티어로 '+(selected?'변경':'추가')+'">'+t+'</button>').join('')+'</div>'}
function friendsPage(){return '<section class="friend-page"><div class="page-heading"><div><span class="eyebrow">같은 영화, 다른 시선</span><h1>친구의 취향도 함께</h1><p>공유받은 목록을 등록하고, 우리 취향을 비교해 보세요.</p></div></div><form class="friend-form" id="friend-form" novalidate><h2>링크로 친구 등록</h2><p>친구가 복사한 공유 링크나 공유 코드를 붙여 넣어 주세요.</p><label class="sr-only" for="friend-link">친구의 공유 링크 또는 코드</label><div class="friend-input-row"><textarea id="friend-link" placeholder="친구의 공유 링크 또는 공유 코드" rows="2" maxlength="12000" spellcheck="false" aria-describedby="friend-error"></textarea><button class="primary" type="submit">'+icon('plus')+'친구 등록</button></div><div class="form-error" id="friend-error" role="alert"></div></form><div class="section-heading"><h2>등록한 친구 <span style="color:var(--accent)">'+data.friends.length+'</span></h2><span>같은 영화의 티어를 함께 표시해요</span></div><div class="friend-cards">'+(data.friends.length?data.friends.map((f,i)=>'<article class="friend-card">'+avatar(f.name,i)+'<h3>'+esc(f.name)+'</h3><p>함께 본 영화 '+overlap(f)+'편<br>같은 티어 비율 '+(matches(f)===null?'비교 전':matches(f)+'%')+'</p><button class="secondary" data-action="friend-view" data-id="'+esc(f.id)+'">티어리스트 보기 '+icon('arrow')+'</button><button class="remove-friend" data-action="remove-friend" data-id="'+esc(f.id)+'">친구 목록에서 빼기</button></article>').join(''):'<div class="empty-friends" style="grid-column:1/-1">등록된 친구가 없어요. 아래 예시 링크로 먼저 체험해 보세요.</div>')+'</div><section class="example-zone"><h2>예시 친구로 먼저 만나보기</h2><p>수연·민준·하린은 체험을 위한 가상의 친구예요.<br>버튼으로 링크를 채운 다음, 친구 등록을 눌러 보세요.</p><div class="examples">'+SAMPLE_FRIENDS.map(f=>'<button class="example-button" data-action="example-link" data-id="'+f.id+'">'+esc(f.name)+' 링크 채우기</button>').join('')+'</div></section><p class="aside-help" style="margin-top:17px">친구 정보는 링크에 담긴 시점의 기록이에요. 새 링크를 등록하면 최신 내용으로 바뀌어요.<br>파일만으로 체험하는 시제품이라 친구의 변경 사항이 자동으로 갱신되지는 않아요.</p></section>'}
function render(){if(shared){showPublic();return}if(sharedError){showInvalid();return}if(!logged){showLogin();return}root.className='';root.innerHTML=header()+warning()+'<main class="wrap" id="main-content">'+(page==='journal'?journal():page==='search'?searchPage():friendsPage())+footer()+'</main>'+nav().bottom}
function navigate(next){if(shared||sharedError){shared=null;sharedError='';clearHash()}page=next;targetTier=null;render();window.scrollTo(0,0)}
function toast(message,undo=null){clearTimeout(toastTimer);undoAction=undo;const t=document.getElementById('toast');t.innerHTML='<span>'+esc(message)+'</span>'+(undo?'<button data-action="undo">되돌리기</button>':'');t.classList.add('show');toastTimer=setTimeout(()=>{t.classList.remove('show');undoAction=null},undo?7000:4200)}
function writeTier(id,tier){if(shared||!logged)return;if(!validMovie(id)||!TIERS.includes(tier))return;const prev=data.entries[id];data.entries[id]={tier,note:prev?.note||''};save();if(page==='search'){const container=document.getElementById('search-results');if(container)container.innerHTML=searchCards()}else render();if(modal.open&&activeMovie===id){body.querySelectorAll('[data-action="set-tier"]').forEach(b=>{b.classList.toggle('selected',b.dataset.tier===tier);b.setAttribute('aria-pressed',String(b.dataset.tier===tier))});if(!body.querySelector('#movie-memo'))renderDetail(id)}toast(MOVIES[id-1].title+' · '+tier+' 티어로 '+(prev?'변경했어요':'담았어요')+(storageOK?'':' (자동 저장은 제한돼요)'))}
function openModal(html){lastFocus=document.activeElement;body.innerHTML=html;if(!modal.open)modal.showModal()}
function modalHead(title){return '<div class="dialog-head"><h2 id="modal-title">'+title+'</h2><button class="close-button" data-action="close" aria-label="창 닫기">'+icon('close')+'</button></div>'}
function closeModal(){if(activeMovie&&memoDirty){saveMemo(false)}if(modal.open)modal.close();activeMovie=null;memoDirty=false;const target=lastFocus;if(target?.isConnected)target.focus()}
function renderDetail(id){const m=MOVIES[id-1];if(!m)return;const readOnly=!!shared;const entry=!readOnly?data.entries[id]:null;const selected=readOnly?shared.ratings[id]:entry?.tier;let html=modalHead(readOnly?'영화 정보':'영화와 나의 기록')+'<div class="detail-top">'+poster(m)+'<div><h3>'+esc(m.title)+'</h3><p class="meta">'+m.year+' · 최초 개봉·공개<br>'+esc(m.director)+'</p><span class="pill" style="margin-top:12px;background:'+(selected?COLORS[selected]:'#eeeee8')+'">'+(selected?(readOnly?esc(shared.name)+'의 티어 ':'내 티어 ')+selected:'아직 기록하지 않은 영화')+'</span></div></div><p class="detail-story">'+esc(m.story)+'</p>';
 if(!readOnly){html+='<label class="field-label">나의 티어</label>'+picker(id,selected);if(entry)html+='<label class="field-label" for="movie-memo">나만의 감상 메모 <span>최대 1,500자</span></label><textarea class="memo-field" id="movie-memo" maxlength="1500" placeholder="이 영화의 어떤 장면이 마음에 남았나요?">'+esc(entry.note)+'</textarea><div class="char-count" id="memo-count">'+entry.note.length+' / 1,500</div><p class="memo-explainer">'+icon('lock')+'메모는 나만 볼 수 있고, 공유 정보에 포함되지 않아요.</p><div class="dialog-actions"><button class="delete-button" data-action="remove-movie" data-id="'+id+'">목록에서 삭제</button><button class="primary" data-action="save-memo">'+icon('check')+'메모 저장</button></div>';else html+='<p class="share-explain">티어를 선택하면 내 목록에 추가되고 메모를 쓸 수 있어요.</p>';html+='<div class="detail-friends"><p class="small">'+icon('people')+' 이 영화를 본 친구</p><div class="friend-tiers">'+(friendBadges(id)||'<span class="no-friends-inline">등록한 친구 중 이 영화의 기록이 아직 없어요.</span>')+'</div></div>'}else html+='<p class="share-note">'+icon('lock')+'감상 메모는 공유되지 않아요.</p>';
 openModal(html);activeMovie=readOnly?null:id;memoDirty=false;
}
function saveMemo(notify=true){if(!activeMovie||!data.entries[activeMovie]||shared)return;const input=document.getElementById('movie-memo');if(!input)return;data.entries[activeMovie].note=input.value.slice(0,1500);save();memoDirty=false;if(page==='journal')render();if(notify)toast(storageOK?'나만의 메모를 저장했어요':'현재 화면에 메모를 반영했어요. 자동 저장은 제한돼요.')}
function publicPayload(){const ratings={};for(const[id,e]of Object.entries(data.entries))ratings[id]=e.tier;return cleanPublic({v:1,id:data.profile.id,name:data.profile.name,ratings})}
function encodePayload(x){const bytes=new TextEncoder().encode(JSON.stringify(cleanPublic(x)));let str='';bytes.forEach(n=>str+=String.fromCharCode(n));return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodePayload(encoded){if(encoded.length>10000||!/^[A-Za-z0-9_-]+$/.test(encoded))throw new Error('공유 형식이 올바르지 않아요.');let str=encoded.replace(/-/g,'+').replace(/_/g,'/');str+='='.repeat((4-str.length%4)%4);const bytes=Uint8Array.from(atob(str),c=>c.charCodeAt(0));return cleanPublic(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)))}
function baseUrl(){return location.href.split('#')[0]}
function shareLink(payload){return baseUrl()+'#share='+encodePayload(payload)}
function shareCode(payload){return '영화기록:v1:'+encodePayload(payload)}
function parseLink(text){const s=text.trim();if(!s)throw new Error('공유받은 링크나 코드를 먼저 입력해 주세요.');if(s.length>12000)throw new Error('공유 링크가 너무 길어요.');if(s.startsWith('영화기록:v1:'))return decodePayload(s.slice('영화기록:v1:'.length));let u;try{u=new URL(s)}catch{throw new Error('공유 링크 또는 영화기록:v1:로 시작하는 코드를 입력해 주세요.')}if(!['file:','https:','http:'].includes(u.protocol))throw new Error('사용할 수 없는 링크 형식이에요.');const h=new URLSearchParams(u.hash.slice(1));const code=h.get('share');if(!code)throw new Error('티어 정보가 없는 링크예요. 친구에게 공유하기에서 복사한 링크를 받아 주세요.');return decodePayload(code)}
function refreshShareFields(){if(!modal.open)return;const link=body.querySelector('#share-url'),code=body.querySelector('#share-code');if(link)link.value=shareLink(publicPayload());if(code)code.value=shareCode(publicPayload());const count=body.querySelector('#share-count');if(count)count.textContent=Object.keys(data.entries).length+'편의 티어만 공유해요.'}
function shareDialog(){activeMovie=null;const p=publicPayload();openModal(modalHead('나의 취향 나누기')+'<p class="share-note">'+icon('lock')+'<span id="share-count">'+Object.keys(p.ratings).length+'편의 티어만 공유해요.</span> 감상 메모는 빠져요.</p><label class="field-label" for="share-name">공유할 이름</label><input class="share-name" id="share-name" value="'+esc(data.profile.name)+'" maxlength="30" placeholder="공유할 이름"><label class="field-label" for="share-url">내 공유 링크</label><div class="copy-row"><input id="share-url" value="'+esc(shareLink(p))+'" readonly aria-label="내 공유 링크"><button class="primary" data-action="copy-link">'+icon('copy')+'복사</button></div><p class="share-explain">이 링크는 현재 HTML 파일에 티어 정보를 붙인 주소예요. 같은 파일이 같은 위치에 있는 환경에서 열 수 있어요. 다른 기기에 보낼 때는 아래 공유용 HTML을 함께 보내 주세요.</p><div style="margin-top:14px"><button class="text-button" data-action="preview-share">공유 화면 미리보기 '+icon('arrow')+'</button></div><div class="share-alt"><label class="field-label" for="share-code" style="margin-top:0">친구 등록용 공유 코드</label><div class="copy-row"><input id="share-code" value="'+esc(shareCode(p))+'" readonly aria-label="친구 등록용 공유 코드"><button class="secondary" data-action="copy-code">코드 복사</button></div><p class="share-explain">친구는 자기 기록장의 ‘친구’ 화면에 이 코드를 붙여 넣어 등록할 수 있어요.</p></div><div class="share-alt"><p>다른 기기에서도 파일을 열어볼 수 있도록,<br>메모가 빠진 공유용 HTML 파일로 저장할 수 있어요.<br>공유한 뒤 변경한 티어는 다시 공유해야 반영돼요.</p><button class="secondary" data-action="export-share">'+icon('download')+'공유용 HTML 저장</button></div>')}
async function copyText(text,input){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('복사했어요. 친구에게 보내 주세요.');return}}catch{}const field=document.getElementById(input);if(field){field.focus();field.select();field.setSelectionRange(0,field.value.length)}try{if(document.execCommand('copy')){toast('복사했어요. 친구에게 보내 주세요.');return}}catch{}toast('복사할 내용을 선택했어요. 길게 누르거나 복사 단축키를 사용해 주세요.')}
function exportPublic(){const payload=cleanPublic(shared||publicPayload());const safe=JSON.stringify(payload).replace(/</g,'\\u003c');const marker='<script type="application/json" id="public-snapshot">';const start=FILE_TEMPLATE.indexOf(marker)+marker.length;const end=FILE_TEMPLATE.indexOf('<'+'/script>',start);if(start<marker.length||end<0){toast('공유 파일을 만들지 못했어요. 공유 코드를 복사해 주세요.');return}const html=FILE_TEMPLATE.slice(0,start)+safe+FILE_TEMPLATE.slice(end);const blob=new Blob([html],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=payload.name.replace(/[\\/:*?"<>|]/g,'').slice(0,20)+'의_영화_티어리스트.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('메모가 빠진 공유용 파일을 저장했어요.')}
function registerFriend(){const field=document.getElementById('friend-link'),error=document.getElementById('friend-error');try{const f=parseLink(field.value);if(f.id===data.profile.id)throw new Error('내 목록이에요. 친구의 링크나 코드를 입력해 주세요.');const index=data.friends.findIndex(v=>v.id===f.id);if(index>=0)data.friends[index]=f;else data.friends.push(f);save();render();toast(escPlain(f.name)+(index>=0?'의 공유 기록을 업데이트했어요':'을(를) 친구로 등록했어요'))}catch(e){error.textContent=e.message||'공유 정보를 읽을 수 없어요.';field.setAttribute('aria-invalid','true');field.focus()}}
function escPlain(x){return String(x)}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch{location.hash=''}}
function viewShared(payload){if(modal.open)closeModal();shared=cleanPublic(payload);sharedError='';render();window.scrollTo(0,0)}
function showPublic(){const p=shared;root.className='public';root.innerHTML=header(true)+'<div class="shared-banner">'+icon('lock')+'티어만 공개된 읽기 전용 목록이에요. 감상 메모는 포함되지 않아요.</div><main class="wrap shared-summary"><div class="page-heading"><div><div class="public-owner">'+avatar(p.name)+'<span class="eyebrow">'+esc(p.name)+'의 영화 취향</span></div><h1>'+esc(p.name)+'의 영화 기록장</h1><p class="public-description">'+Object.keys(p.ratings).length+'편의 영화에 담긴 취향을 만나보세요.</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px"><button class="secondary" data-action="return-own">'+icon('back')+(logged?'내 기록장으로':'나도 기록 시작하기')+'</button>'+(p.id!==data.profile.id?'<button class="primary" data-action="register-shared">'+icon('people')+'이 친구 등록하기</button>':'')+'<button class="secondary" data-action="public-code">'+icon('copy')+'친구 등록용 코드</button><button class="secondary" data-action="export-share">'+icon('download')+'공유용 HTML 저장</button></div>'+tierBoard(p.ratings,true)+footer(true)+'</main>'}
function showInvalid(){root.className='public';root.innerHTML=header(true)+'<main class="wrap"><section class="nothing" style="margin-top:45px"><h1>공유 목록을 열 수 없어요</h1><p style="margin:15px 0 20px">'+esc(sharedError)+'<br>공유 링크가 중간에 잘리지 않았는지 확인해 주세요.</p><button class="primary" data-action="return-own">기록장으로 돌아가기</button></section></main>'}
function loadShared(){sharedError='';try{const h=new URLSearchParams(location.hash.slice(1)),code=h.get('share');if(code){shared=decodePayload(code);return}if(pinnedSnapshot){shared=cleanPublic(pinnedSnapshot);return}shared=null}catch{shared=null;sharedError='올바른 티어 정보가 담긴 링크가 아니에요.'}}
function help(){activeMovie=null;openModal(modalHead('기록장 사용 안내')+'<div class="help-content"><h3>시작하기</h3><p>‘예시 계정으로 시작하기’를 누르면 지우의 예시 기록장으로 입장해요. 영화 20편과 가상의 친구 3명을 준비했어요. 처음에는 수연이 친구로 등록되어 있어요.</p><h3>영화와 감상 기록</h3><p>‘영화 찾기’에서 제목·감독·연도로 검색한 뒤 S·A·B·C·D를 선택해요. 내 기록장에서 영화를 누르면 티어 변경, 감상 메모, 삭제를 할 수 있어요. 작성 중 창을 닫아도 메모를 반영해요.</p><h3>친구의 티어 비교</h3><p>‘친구’에서 공유 링크 또는 코드를 붙여 넣어 등록해요. 예시 친구의 링크로도 체험할 수 있어요. 같은 영화에는 등록된 친구들의 티어가 모두 보여요. 친구 화면의 비율은 함께 본 영화 중 같은 티어를 매긴 비율이에요.</p><h3>서버 없이 공유하기</h3><p>링크에는 이름과 영화별 티어만 들어가요. 파일 경로가 다른 기기에서는 링크가 바로 열리지 않을 수 있어요. ‘공유용 HTML 저장’으로 내려받은 파일을 보내면 받는 사람이 그 파일을 직접 열어 목록을 볼 수 있어요. 공유 코드는 친구 등록에 사용할 수 있어요. 공유는 보낸 시점의 기록이며 자동 갱신되지 않아요.</p><h3>기록 저장과 메모</h3><p>메모는 공유 링크·코드·공유용 파일에 포함되지 않아요. 내 기록은 이 브라우저의 저장 공간에 보관해요. 브라우저 설정이나 파일 위치에 따라 저장이 제한될 수 있고, 브라우저 데이터를 지우면 기록도 사라질 수 있어요. 이 시제품은 실제 계정 인증과 기기 간 동기화를 제공하지 않아요.</p><h3>예시 영화 자료</h3><p>기획서에 있는 영화 20편의 정보가 파일에 들어 있어요. 연도는 최초 개봉·공개 연도예요. 포스터는 실제 공식 포스터를 대신하는 내장 예시 그림이며, 외부 이미지나 글꼴을 불러오지 않아요.</p></div>'+(logged?'<div class="dialog-actions"><button class="secondary" data-action="logout">'+icon('logout')+'예시 계정 나가기</button><button class="primary" data-action="close">알겠어요</button></div>':'<div class="dialog-actions"><span></span><button class="primary" data-action="close">알겠어요</button></div>'))}
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action,id=Number(button.dataset.id);
 if(action==='login'){logged=true;save();render();window.scrollTo(0,0);return}
 if(action==='navigate'){navigate(button.dataset.page);return}
 if(action==='help'){if(modal.open)closeModal();help();return}
 if(action==='logout'){closeModal();logged=false;page='journal';render();return}
 if(action==='filter'){filter=button.dataset.tier;render();return}
 if(action==='add-to-tier'){page='search';targetTier=button.dataset.tier;query='';render();window.scrollTo(0,0);document.getElementById('movie-search')?.focus();return}
 if(action==='detail'){renderDetail(id);return}
 if(action==='close'){closeModal();return}
 if(action==='set-tier'){writeTier(id,button.dataset.tier);return}
 if(action==='save-memo'){saveMemo();return}
 if(action==='remove-movie'){if(shared||!logged||!data.entries[id])return;if(activeMovie===id&&memoDirty)saveMemo(false);const previous={...data.entries[id]};delete data.entries[id];memoDirty=false;activeMovie=null;modal.close();save();render();toast(MOVIES[id-1].title+'을(를) 목록에서 뺐어요',()=>{data.entries[id]=previous;save();render();toast('영화와 메모를 되돌렸어요')});return}
 if(action==='clear-query'){query='';if(page!=='search')page='search';render();document.getElementById('movie-search')?.focus();return}
 if(action==='share'){shareDialog();return}
 if(action==='copy-link'){await copyText(shareLink(publicPayload()),'share-url');return}
 if(action==='copy-code'){await copyText(shareCode(publicPayload()),'share-code');return}
 if(action==='preview-share'){viewShared(publicPayload());return}
 if(action==='export-share'){exportPublic();return}
 if(action==='example-link'){const f=SAMPLE_FRIENDS.find(v=>v.id===button.dataset.id);if(f){const input=document.getElementById('friend-link');input.value=shareLink(f);input.removeAttribute('aria-invalid');document.getElementById('friend-error').textContent='';input.focus();input.scrollIntoView({block:'center',behavior:'smooth'})}return}
 if(action==='friend-view'){const f=data.friends.find(v=>v.id===button.dataset.id);if(f)viewShared(f);return}
 if(action==='remove-friend'){const i=data.friends.findIndex(v=>v.id===button.dataset.id);if(i<0)return;const f=data.friends[i];data.friends.splice(i,1);save();render();toast(f.name+'을(를) 친구 목록에서 뺐어요',()=>{if(!data.friends.some(x=>x.id===f.id))data.friends.splice(Math.min(i,data.friends.length),0,f);save();render();toast('친구를 다시 등록했어요')});return}
 if(action==='return-own'){shared=null;sharedError='';pinnedSnapshot=null;clearHash();page='journal';render();window.scrollTo(0,0);return}
 if(action==='register-shared'){const f=cleanPublic(shared);if(f.id===data.profile.id){toast('내 목록은 친구로 등록할 수 없어요');return}const i=data.friends.findIndex(v=>v.id===f.id);if(i>=0)data.friends[i]=f;else data.friends.push(f);save();toast(f.name+(i>=0?'의 기록을 업데이트했어요':'을(를) 친구로 등록했어요'));return}
 if(action==='public-code'){openModal(modalHead('친구 등록용 공유 코드')+'<p class="share-note">'+esc(shared.name)+'의 티어 정보만 담겨 있어요.</p><label class="field-label" for="public-code">내 기록장의 ‘친구’ 화면에 붙여 넣으세요.</label><div class="copy-row"><input id="public-code" value="'+esc(shareCode(shared))+'" readonly><button class="primary" data-action="copy-public-code">복사</button></div>');return}
 if(action==='copy-public-code'){await copyText(shareCode(shared),'public-code');return}
 if(action==='undo'){const undo=undoAction;undoAction=null;if(undo)undo();return}
});
document.addEventListener('submit',event=>{if(event.target.id==='friend-form'){event.preventDefault();registerFriend()}});
document.addEventListener('input',event=>{
 if(event.target.id==='movie-search'){query=event.target.value;const results=document.getElementById('search-results'),count=document.getElementById('search-count');if(results)results.innerHTML=searchCards();if(count)count.textContent=(query?'검색 결과':'준비된 영화')+' '+searchMovies().length+'편';const clear=root.querySelector('.clear-search');if(clear)clear.hidden=!query}
 if(event.target.id==='movie-memo'){memoDirty=true;const count=document.getElementById('memo-count');if(count)count.textContent=event.target.value.length+' / 1,500'}
 if(event.target.id==='share-name'){const name=event.target.value.trim().slice(0,30);if(name){data.profile.name=name;save();refreshShareFields()}}
 if(event.target.id==='friend-link'){event.target.removeAttribute('aria-invalid');const error=document.getElementById('friend-error');if(error)error.textContent=''}
});
modal.addEventListener('cancel',event=>{event.preventDefault();closeModal()});
modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal()}});
window.addEventListener('beforeunload',()=>{if(memoDirty)saveMemo(false)});
window.addEventListener('hashchange',()=>{if(modal.open)closeModal();loadShared();render();window.scrollTo(0,0)});
try{pinnedSnapshot=JSON.parse(document.getElementById('public-snapshot').textContent)}catch{sharedError='공유 파일의 정보를 읽을 수 없어요.'}
loadShared();render();
})();
</script>
</body>
</html>
